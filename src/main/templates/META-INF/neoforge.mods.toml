license="${mod_license}"

issueTrackerURL="https://github.com/Heroshrine/SmokerEffects/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

displayUrl="https://www.curseforge.com/minecraft/mc-mods/smoker-effects"

logoFile="assets/smokeyseasonings/textures/item/seasoning_pouch_empty.png"

authors="Heroshrine"

description='''
Smoke food with seasonings by burning seasoning pouches in the Smoker, giving light but long lasting effects.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
